<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daisei Tanaka – Apps</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; margin: 0; padding: 48px 16px; color: #1d1d1f; background: #fff; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 32px; }
  .app { display: flex; gap: 16px; align-items: center; }

  .app p { margin: 0 0 8px; color: #6e6e73; font-size: 14px; }
  a { color: #0066cc; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } .app p { color: #a1a1a6; } a { color: #2997ff; } }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <div class="app">
    <div>
      <h2>Bomber Timer</h2>
      <p>爆弾がテーマのカウントダウンタイマー</p>
      <a href="https://apps.apple.com/jp/app/id1640816018">App Store で見る</a>
    </div>
  </div>
</main>
</body>
</html>
